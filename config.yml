# 搜索条件
keywords: [ai, llm, agent, gpt, mcp, claude]   # GitHub 搜索最多允许 5 个 OR，即 6 个词
window_days: 90          # 只看最近 N 天内创建的仓库
min_stars: 5000          # 星数门槛（大于）

# 介绍生成
# backend: claude-cli 走 Claude 订阅（需要 CLAUDE_CODE_OAUTH_TOKEN，消耗 Pro 额度）
#          api        走 Claude API 按量计费（需要 ANTHROPIC_API_KEY）
backend: claude-cli
model: claude-sonnet-5   # 订阅额度有限，推荐 Sonnet；可改为 claude-opus-5
effort: medium           # 仅 api 模式生效：low / medium / high
refresh_after_days: 30   # README 有变化且缓存超过 N 天才重新生成介绍
readme_max_chars: 12000  # 送给模型的 README 摘录长度上限

# 变化摘要
top_gainers: 5

# 短期榜（scripts/rising.py）。时间窗口按 UTC 完整自然日：近 7 天 = 运行日前 7 天，前 7 天 = 再往前 7 天
rising:
  newborn_min: 500        # 新星：近 7 天创建，≥500★（≤主榜门槛），每个都写一句话
  newborn_tiers: [500, 1000, 2000]
  young_list_min: 1000    # 新锐：8–30 天创建，≥1000★ 列名字
  young_intro_min: 2000   #       ≥2000★ 写一句话
  surge_list_min: 1000    # 升星：近 7 天涨 ≥1000 列名字
  surge_intro_min: 2000   #       ≥2000 写一句话（猛涨），最多 surge_intro_max 个
  surge_intro_max: 20
  surge_boom: 5000        #       ≥5000 标「暴涨」
  accel_ratio: 2          # 近 7 天 ≥ 前 7 天 × 2 标「加速」
  pool_recent_min: 1000   # 测速池：≤90 天创建 ≥1000★ + 91–365 天创建 ≥5000★（控制在 GITHUB_TOKEN 每小时 1000 次以内）
  pool_old_min: 5000
  spam_same_owner: 4      # 同一作者 ≥4 个项目同一周各涨 ≥spam_min_each，整组判为疑似刷星、不进榜
  spam_min_each: 1000     # 2026-10-23 实测：500 会误伤一次推出系列技能包的正常作者（4 个涨 730–1411），
                          # 1000 只命中 8 个仓库各涨 2200–4600、含名为「B」的仓库的作者。误伤会隐藏正常项目，宁可漏判

# 实用分级页（scripts/guide.py → site/guide.html）：主榜 + 升星榜头部按实用性分档，每个写 2–4 条应用场景
# 分级的输入是已缓存的介绍，不再读 README；按项目缓存在 data/practical/，介绍重写过才重新分级
guide:
  surge_full_intro: true  # 升星榜写介绍、但不在主榜的项目（多是创建超过 90 天的老项目）也读完整 README 写介绍再分级。
                          # 每个新项目约多 5k token（2026-10-29 估算），关掉就只分级主榜
  batch: 15               # 每次调用分级几个项目
  # 判断时从最后一档往前逐档看，符合就停；rule 给模型看，desc 给读者看
  tiers:
    - key: A
      name: 立即可用
      desc: 适用面广，一条命令或一个安装包就能用，风险低
      rule: 适用面广，一条命令、一个插件或一个安装包就能用上，风险低
    - key: B
      name: 岗位利器
      desc: 在特定职业或场景里非常实用，场景之外用处不大
      rule: 在特定职业或场景里很实用（安全、测试、求职、视频制作、SEO、设计、游戏等），场景之外用处不大
    - key: C
      name: 团队基建
      desc: 要部署、要运维，适合有工程能力的团队搭内部平台或业务系统
      rule: 要自己部署服务、数据库或云账户才能用，主要面向团队或企业搭平台、做业务系统
    - key: D
      name: 尝鲜参考
      desc: 模板、实验品、研究项目和学习资料，适合学思路，暂不建议直接上生产
      rule: README 自称模板、Alpha、MVP、实验或研究原型；或主要价值是学习材料、提示词清单、技术演示；或实际表现达不到日常使用（如极慢、成功率低）
    - key: E
      name: 风险警示
      desc: 功能确实有用，但服务条款、隐私或法律风险突出，用之前先想清楚
      rule: 核心卖点建立在违反服务条款、绕过平台或模型限制、采集他人隐私、规避法规（如删除 AI 内容标识）之上，或被标为疑似刷星；即使很有用也归这一档
      warn: true
  domains: [编程提效, 设计审美, 内容创作, 办公文档, 求职, 测试, 营销 SEO, 安全逆向, 游戏, Agent 平台, 知识与资讯, 模型网关, 研究学习, 业务应用, 其他]

# 发布地址：RSS、通知里的链接用它拼
site_url: https://drgg.github.io/ai-trending-radar
repo_url: https://github.com/drgg/ai-trending-radar

# 程序化风险标记
risk:
  min_fork_ratio: 0.01   # fork/star 低于该比例视为异常
  stale_days: 30         # 超过 N 天未 push 视为停更

categories:
  - 编程 Agent 与运行框架
  - Agent 平台与基础设施
  - AI 应用产品
  - 本地推理与模型
  - Skills 与写作/设计
  - 开发者工具与集成
  - 安全防护与合规
  - 攻击性安全（仅限授权测试）
  - 越狱与绕过模型限制
  - 其他

# 高风险分类：页面上用警示样式显示，并在分类标题下附这段说明。
# 原来的“安全相关”会让越狱、攻击类工具看起来像防护产品，2026-10-04 拆分。
warn_categories:
  攻击性安全（仅限授权测试）: 渗透测试、漏洞利用、红队等攻击性工具，只能用于自己拥有或获得书面授权的系统，未经授权使用可能违法。
  越狱与绕过模型限制: 核心功能是绕过 AI 模型或平台的安全限制，非官方支持、违反服务条款，使用可能导致封号。
